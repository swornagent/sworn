name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  portable-macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GOFLAGS: -buildvcs=false
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Host-path portability
        run: |
          go test -count=1 -p=1 -timeout=10m \
            ./cmd/sworn \
            ./internal/cockpit \
            ./internal/driver \
            ./internal/journal \
            ./internal/runtime
      - name: Git portability
        run: |
          go test -count=1 -p=1 -timeout=10m \
            ./internal/gitx \
            ./tools/batongolden
      - name: Baton composition contracts
        run: |
          go test -count=1 -timeout=10m \
            -run '^(TestAssemblyTransactionsFencePostClassificationTrackDrift|TestActionsMatchExactReferenceForSHA1AndSHA256|TestPlanRevisionRetentionSelectiveInvalidationAndRetirement|TestPlanRevisionReconcilesOnlyExactPreparedBase|TestAssemblyDirectReuseRequiresExactComposition|TestPlanAdmissionMatchesExactBatonGolden)$' \
            ./internal/baton
      - name: Vet
        run: go vet ./...
      - name: Portable binary
        run: |
          CGO_ENABLED=0 go build \
            -mod=readonly \
            -buildvcs=false \
            -trimpath \
            -o "${RUNNER_TEMP}/sworn" \
            ./cmd/sworn

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOFLAGS: -buildvcs=false
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Provision Linux sandbox
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          if [[ -e /proc/sys/kernel/unprivileged_userns_clone ]]; then
            echo 1 | sudo tee \
              /proc/sys/kernel/unprivileged_userns_clone >/dev/null
          fi
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo 0 | sudo tee \
              /proc/sys/kernel/apparmor_restrict_unprivileged_userns >/dev/null
          fi
          /usr/bin/bwrap --version
          /usr/bin/bwrap \
            --die-with-parent \
            --new-session \
            --unshare-all \
            --unshare-user \
            --disable-userns \
            --cap-drop ALL \
            --clearenv \
            --ro-bind / / \
            /usr/bin/true
      - name: Product formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(
            git ls-files -z -- '*.go' \
              ':(exclude,top).baton/releases/**' |
              xargs -0 -r gofmt -l
          )"
          test -z "$unformatted"
          product_pathspec=(
            .
            ':(exclude,top).baton/releases'
            ':(exclude,top).baton/releases/**'
          )
          git diff --check -- "${product_pathspec[@]}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git diff --check \
              "${{ github.event.pull_request.base.sha }}...HEAD" \
              -- "${product_pathspec[@]}"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]] &&
            git cat-file -e "${{ github.event.before }}^{commit}"; then
            git diff --check \
              "${{ github.event.before }}..HEAD" \
              -- "${product_pathspec[@]}"
          else
            git diff-tree --check --root -r HEAD \
              -- "${product_pathspec[@]}"
          fi
      - name: Module is tidy
        run: go mod tidy -diff
      - name: Product tests
        run: go test -count=1 ./cmd/sworn ./internal/... ./tools/...
      - name: End-to-end tests
        run: go test -count=1 -parallel=1 -timeout=20m ./test/e2e
      - name: Race test
        run: go test -count=1 -race ./cmd/sworn ./internal/... ./tools/...
      - name: Vet
        run: go vet ./...
      - name: Official binary
        run: |
          CGO_ENABLED=0 go build \
            -mod=readonly \
            -buildvcs=false \
            -trimpath \
            -o "${RUNNER_TEMP}/sworn" \
            ./cmd/sworn
