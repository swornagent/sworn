name: CI

on:
  push:
    branches:
      - main
      # Code lands on a release branch first and reaches main only at
      # promotion, so filtering pushes to main alone left the release branch
      # verified solely by whoever happened to open a pull request into it.
      # Seventy-eight commits once accumulated there unchecked. The glob
      # covers the next release line without anyone remembering this file.
      #
      # Deliberately not track/** or release-wt/**: the engine pushes to those
      # on every candidate and verifier pass, and their intermediate states are
      # meant to be incomplete. Running here would teach us to ignore red.
      - 'release/**'
  pull_request: {}

# Supersede rather than queue. Several pushes in quick succession would
# otherwise hold several forty-five-minute runs against trees already replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # A push to main or release/** already runs this workflow on the same
    # commit; a same-repo pull request from one of those branches would run
    # it a second time for nothing (checks attach per-commit). Forks and
    # ordinary topic branches still get their pull_request run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      (github.event.pull_request.head.ref != 'main' &&
       !startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOFLAGS: -buildvcs=false
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Provision Linux sandbox
        # Hosted runners intermittently hang inside this step with zero
        # output (sworn#223, four occurrences); the step timeout converts a
        # silent hour-long squat into a fast, attributable failure, and the
        # markers make a hang distinguishable from slow apt work.
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::apt"
          echo "provision: apt-get update starting"
          sudo apt-get update
          echo "provision: apt-get install starting"
          sudo apt-get install --yes --no-install-recommends bubblewrap
          echo "provision: apt done"
          echo "::endgroup::"
          if [[ -e /proc/sys/kernel/unprivileged_userns_clone ]]; then
            echo 1 | sudo tee \
              /proc/sys/kernel/unprivileged_userns_clone >/dev/null
          fi
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo 0 | sudo tee \
              /proc/sys/kernel/apparmor_restrict_unprivileged_userns >/dev/null
          fi
          /usr/bin/bwrap --version
          /usr/bin/bwrap \
            --die-with-parent \
            --new-session \
            --unshare-all \
            --unshare-user \
            --disable-userns \
            --cap-drop ALL \
            --clearenv \
            --ro-bind / / \
            /usr/bin/true
      - name: Module is tidy
        run: go mod tidy -diff
      - name: Product tests
        run: go test -count=1 ./cmd/sworn ./internal/... ./tools/...
      - name: End-to-end tests
        run: go test -count=1 -parallel=1 -timeout=35m ./test/e2e
      - name: Race test
        run: go test -count=1 -race ./cmd/sworn ./internal/... ./tools/...
      - name: Vet
        run: go vet ./...
      - name: Portable build (darwin)
        # Cross-compile only: everything here runs on Linux, so a symbol left
        # in a _linux.go file that neutral code references breaks operator
        # laptops days before anyone notices. Windows is not covered - gitx
        # has known pre-existing unix syscall use.
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...
      - name: Official binary
        run: |
          CGO_ENABLED=0 go build \
            -mod=readonly \
            -buildvcs=false \
            -trimpath \
            -o "${RUNNER_TEMP}/sworn" \
            ./cmd/sworn
  format:
    # Separate from test on purpose: when formatting fast-failed inside the
    # test job, the test steps never ran, and two releases merged with
    # born-failing tests nobody had executed. Both jobs always report.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      (github.event.pull_request.head.ref != 'main' &&
       !startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOFLAGS: -buildvcs=false
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Product formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(
            git ls-files -z -- '*.go' \
              ':(exclude,top).sworn/records/**' |
              xargs -0 -r gofmt -l
          )"
          test -z "$unformatted"
          product_pathspec=(
            .
            ':(exclude,top).sworn/records'
            ':(exclude,top).sworn/records/**'
          )
          git diff --check -- "${product_pathspec[@]}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git diff --check \
              "${{ github.event.pull_request.base.sha }}...HEAD" \
              -- "${product_pathspec[@]}"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]] &&
            git cat-file -e "${{ github.event.before }}^{commit}"; then
            git diff --check \
              "${{ github.event.before }}..HEAD" \
              -- "${product_pathspec[@]}"
          else
            git diff-tree --check --root -r HEAD \
              -- "${product_pathspec[@]}"
          fi
